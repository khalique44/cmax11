<script src="libs/intlTelInput/intlTelInput.min.js"></script>
<script>
	
	$(document).ready(function () {
	    $('#phonenumber').intlTelInput({
	        separateDialCode: true,
			//utilsScript: 'https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/12.1.6/js/utils.js',
	        autoPlaceholder: true,
	        preferredCountries: ['pk', 'us', 'gb']
	    });

	    $('#phonenumber').on("input", function () {
	        if (/^0/.test(this.value)) {
	            this.value = this.value.replace(/^0/, "")
	        }
	    })
	    var emailval=jQuery('input[type="email"]');
	    var phoneVal=jQuery('input[type="tel"]');

	    var email;
	    var phone;

	    emailval.keyup(function() {
	        if( !validate($(this).val(), 'email') ) {
	            email = false;
	        } else {
	            email = true;
	        }

	        if( email !== true || phone !== true){
	            jQuery(':input[type="submit"]').attr('disabled','disabled');
	            console.log('disabled');
	        } else {
	            jQuery(':input[type="submit"]').removeAttr('disabled');
	        }

	    });
	    phoneVal.keyup(function() {

	        if( !validate( $(this).val(), 'tel' ) ) {
	            phone = false;
	        } else {
	            phone = true;
	        }

	        if( email !== true || phone !== true ){
	            jQuery(':input[type="submit"]').attr('disabled','disabled');                
	        } else {
	            jQuery(':input[type="submit"]').removeAttr('disabled');
	        }

	    });
	    function validate(inputval, type){
	        console.log(inputval.length);
	        if(!inputval.length || inputval.length == 0 ){
	            return false;
	        }

	        if(type == 'email'){
	            var emailReg = /^([\w-\.]+@([\w-]+\.)+[\w-]{2,4})?$/;
	            if(emailReg.test(inputval)){
	                return true;
	            } else {
	                return false;
	            }
	        }
	        if (type == 'tel') {
	            var numReg= /^[0-9]*$/;
	            if (numReg.test(inputval)) {
	                return true;
	            } else {
	                return false;
	            }
	        }
	    } 
	});
</script>
